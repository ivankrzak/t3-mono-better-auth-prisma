packages:
  - apps/*
  - packages/*
  - tooling/*

allowBuilds:
  "@prisma/engines": true
  better-sqlite3: false
  bufferutil: false
  esbuild: true
  prisma: true

catalog:
  "@better-auth/expo": ^1.7.27
  "@eslint/js": ^9.39.5
  "@prisma/client": ^7.10.1
  "@tailwindcss/postcss": ^4.3.5
  "@tanstack/react-query": ^5.108.3
  "@trpc/client": ^11.29.7
  "@trpc/server": ^11.29.7
  "@trpc/tanstack-react-query": ^11.29.7
  "@types/node": ^24.19.2
  better-auth: ^1.7.27
  eslint: ^9.39.5
  expo: ~58.0.26
  prettier: ^3.10.1
  react-native: 0.88.1
  react-hook-form: ^7.92.0
  superjson: ^2.2.7
  tailwindcss: ^4.3.5
  typescript: ^6.0.3
  zod: ^4.6.7

catalogs:
  react19:
    "@types/react": ^19.3.0
    "@types/react-dom": ^19.3.0
    react: 19.3.0
    react-dom: 19.3.0

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@legendapp/list@3.9.0"
  - "@tanstack/query-core@5.108.3"
  - "@tanstack/react-query@5.108.3"

overrides:
  # react-native-css's @import handling breaks with lightningcss >= 1.30.2
  lightningcss: 1.30.1

publicHoistPattern:
  - "@ianvs/prettier-plugin-sort-imports"
  - prettier-plugin-tailwindcss
