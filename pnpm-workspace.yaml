packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  "@expo/metro-runtime": ~56.0.15
  "@better-auth/expo": 1.6.9
  "@eslint/js": ^9.38.0
  "@tailwindcss/postcss": ^4.1.16
  "@tailwindcss/vite": ^4.1.16
  "@tanstack/react-form": ^1.23.8
  "@tanstack/react-query": ^5.90.5
  "@trpc/client": ^11.7.0
  "@trpc/server": ^11.7.0
  "@trpc/tanstack-react-query": ^11.7.0
  "@types/node": ^22.18.12
  "@vitejs/plugin-react": 5.1.0
  better-auth: 1.6.9
  eslint: ^9.38.0
  expo: ~56.0.11
  prettier: ^3.6.2
  react-native: ~0.85.3
  tailwindcss: ^4.1.16
  typescript: ^5.9.3
  zod: ^4.3.6
  vite: 7.1.12

catalogs:
  react19:
    "@types/react": ^19.2.17
    "@types/react-dom": ^19.2.3
    react: 19.2.3
    react-dom: 19.2.3

linkWorkspacePackages: true

onlyBuiltDependencies:
